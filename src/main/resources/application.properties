# =============================================
# Spring Boot
# =============================================
spring.application.name=accounts-management
server.port=${PORT:8081}
spring.config.import=optional:file:./.environments/application-secrets.properties

# DataSource se configura manualmente con @Configuration
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Base de datos PostgreSQL -Supabase 
# Supabase puerto 6543
# usar el session pooler (5432) o la conexion directa.
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:5432}
db.name=${DB_NAME:postgres}
db.username=${DB_USERNAME:postgres}
db.password=${DB_PASSWORD:}
db.ssl-mode=${DB_SSL_MODE:require}


# Kafka (Aiven) - productor
# kafka.ssl-ca-certificate: contenido PEM del CA de Aiven (ca.pem). Los saltos de linea
# pueden pasarse como \n en la variable de entorno.
kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.security-protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
kafka.sasl-mechanism=${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
kafka.sasl-username=${KAFKA_SASL_USERNAME:}
kafka.sasl-password=${KAFKA_SASL_PASSWORD:}
kafka.ssl-ca-certificate=${KAFKA_SSL_CA_CERTIFICATE:}
kafka.topic.notifications=${KAFKA_TOPIC_NOTIFICATIONS:notifications-events}