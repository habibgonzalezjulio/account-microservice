# =============================================
# Spring Boot
# =============================================
spring.application.name=accounts-management
server.port=${PORT:8080}
spring.config.import=optional:file:./.environments/application-secrets.properties

# DataSource se configura manualmente con @Configuration
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.accounts.DataSourceAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# =============================================
# Configuracion de Base de Datos PostgreSQL (local, Render o Supabase)
# DB_SSL_MODE: disable | prefer | require | verify-full  (Supabase: require)
# =============================================
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:5432}
db.name=${DB_NAME:crud_usuarios}
db.username=${DB_USERNAME:postgres}
db.password=${DB_PASSWORD:}
db.ssl-mode=${DB_SSL_MODE:prefer}

# =============================================
# Kafka (Aiven): publicacion asincrona del evento account.created en el topic account-events
# Leidas por KafkaSpringConfig. Se aceptan los nombres de variable locales (KAFKA_USERNAME...)
# y los de Render (KAFKA_SASL_USERNAME...).
# =============================================
kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.security-protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
kafka.sasl-mechanism=${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
kafka.sasl-username=${KAFKA_SASL_USERNAME:${KAFKA_USERNAME:}}
kafka.sasl-password=${KAFKA_SASL_PASSWORD:${KAFKA_PASSWORD:}}
# Certificado CA de Aiven en formato PEM (contenido completo, con BEGIN/END CERTIFICATE)
kafka.ssl-ca-certificate=${KAFKA_SSL_CA_CERTIFICATE:${KAFKA_CA_CERT:}}
kafka.topic.notifications=${KAFKA_TOPIC_ACCOUNT_EVENTS:account-events}

# =============================================
# Seguridad JWT
# En produccion defina JWT_SECRET con al menos 32 bytes aleatorios codificados en Base64.
# =============================================
jwt.secret=${JWT_SECRET:}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}

logging.level.org.apache.kafka.clients.NetworkClient=ERROR
logging.level.org.springframework.kafka.support.LoggingProducerListener=OFF